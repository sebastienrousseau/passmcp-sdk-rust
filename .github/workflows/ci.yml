name: CI

on:
  push:
    branches: [main, "feat/v*"]
  pull_request:
    branches: [main]

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }}, rust ${{ matrix.toolchain }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        toolchain: ["1.85.0", "stable"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust (${{ matrix.toolchain }})
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca002feb193a2 # master
        with:
          toolchain: ${{ matrix.toolchain }}
      - name: Test and example
        run: |
          cargo test
          cargo run --example quickstart

  lint-and-hygiene:
    name: Lint, REUSE, Family & Lockstep
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust (stable, rustfmt, clippy)
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca002feb193a2 # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Format & Clippy
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
      - name: REUSE compliance
        uses: fsfe/reuse-action@266f8748c6f7ab9d6fb2fdd2ac1fd5bbea0fb43e # v6.1.2
      - name: Family manifest & version lockstep
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./scripts/family.sh
          ./scripts/lockstep.sh
